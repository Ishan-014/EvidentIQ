name: Recommendation Backend Tests

on:
  pull_request:
    paths:
      - "recommendation/**"
      - ".github/workflows/recommendation-tests.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "recommendation/**"
      - ".github/workflows/recommendation-tests.yml"

jobs:
  recommendation-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run recommendation unit tests
        run: python -m unittest discover -s recommendation/tests -v
